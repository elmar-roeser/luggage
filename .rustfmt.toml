# Defaults:
# rustfmt --help=config
#
# rustup component add rustfmt
# rustup toolchain install nightly
#
# cargo fmt --check
# cargo +nightly fmt --check -- --config group_imports=StdExternalCrate --config format_code_in_doc_comments=true --config reorder_impl_items=true --config normalize_comments=true --unstable-features

edition = "2024"
style_edition = "2024"
newline_style = "Unix"
use_field_init_shorthand = true
use_small_heuristics = "Max"
use_try_shorthand = true
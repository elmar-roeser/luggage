[package]
name = "luggage-env"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Per-project Nix dev environments (flake + direnv) for PHP, Node, Python and Rust, detected from project files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elmar-roeser/luggage"
readme = "README.md"
keywords = ["nix", "direnv", "devshell", "php", "python"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "luggage"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
pedantic = { level = "warn", priority = -1 }
